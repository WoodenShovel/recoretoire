        <button class="icon-btn" data-act="view" data-i="${i}" aria-label="${t('viewClassAria')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="icon-btn" data-act="load" data-i="${i}" aria-label="${t('editClassAria')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </div>
    </div>`;
  }).join("");

  savedList.querySelectorAll('[data-act="share"]').forEach(b=>b.addEventListener("click", ()=> shareSavedClass(+b.dataset.i)));
  savedList.querySelectorAll('[data-act="view"]').forEach(b=>b.addEventListener("click", ()=> showDetalle(+b.dataset.i)));
  savedList.querySelectorAll('[data-act="load"]').forEach(b=>b.addEventListener("click", ()=>{
    const p = savedPlans[+b.dataset.i];
    plan = { name:p.name, date:p.date, items: JSON.parse(JSON.stringify(p.items)), blocks: JSON.parse(JSON.stringify(p.blocks||[])) };
    editingSavedIndex = +b.dataset.i;
    persistPlan();
    document.getElementById("planName").value = plan.name;
    document.getElementById("planDate").value = plan.date;
    document.querySelector('.tab[data-view="clase"]').click();
    renderPlan();
  }));
  bindSavedDrag(entries);
  bindSavedLongPress();
}

/* ---------- arrastrar para reordenar clases guardadas ---------- */
function bindSavedDrag(entries){
  savedList.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.addEventListener('pointerdown', e=>{
      e.preventDefault();
      const item = handle.closest('.saved-item');
      const items = Array.from(savedList.children);
      const startIndex = items.indexOf(item);
      const style = getComputedStyle(item);
      const itemHeight = item.offsetHeight + parseFloat(style.marginBottom || 0);
      const order = items.map((_, k) => k); // visual order, by original index

      let currentIndex = startIndex;
      const startY = e.clientY;
      const startScrollY = window.scrollY;
      let lastClientY = e.clientY;
      let scrollSpeed = 0;
      let scrollRAF = null;

      item.classList.add('dragging');
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}

      function applyOrder(){
        items.forEach((el, originalPos) => {
          if(el === item) return;
          const visualPos = order.indexOf(originalPos);
          const offset = (visualPos - originalPos) * itemHeight;
          el.style.transition = 'transform .15s ease';
          el.style.transform = offset ? `translateY(${offset}px)` : '';
        });
      }

      function updatePosition(){
        const dy = (lastClientY - startY) + (window.scrollY - startScrollY);
        item.style.transform = `translateY(${dy}px)`;

        const rawTarget = startIndex + Math.round(dy / itemHeight);
        const newIndex = Math.min(items.length - 1, Math.max(0, rawTarget));
        if(newIndex !== currentIndex){
          order.splice(order.indexOf(startIndex), 1);
          order.splice(newIndex, 0, startIndex);
          currentIndex = newIndex;
          applyOrder();
        }
      }

      function updateAutoScroll(clientY){
        const edge = 70, maxSpeed = 16;
        const vh = window.innerHeight;
        if(clientY < edge) scrollSpeed = -maxSpeed * (1 - clientY/edge);
        else if(clientY > vh - edge) scrollSpeed = maxSpeed * (1 - (vh-clientY)/edge);
        else scrollSpeed = 0;

        if(scrollSpeed !== 0 && !scrollRAF){
          const step = ()=>{
            window.scrollBy(0, scrollSpeed);
            updatePosition();
            scrollRAF = scrollSpeed !== 0 ? requestAnimationFrame(step) : null;
          };
          scrollRAF = requestAnimationFrame(step);
        } else if(scrollSpeed === 0 && scrollRAF){
          cancelAnimationFrame(scrollRAF);
          scrollRAF = null;
        }
      }

      function onMove(ev){
        lastClientY = ev.clientY;
        updatePosition();
        updateAutoScroll(ev.clientY);
      }

      function onUp(){
        try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        if(scrollRAF){ cancelAnimationFrame(scrollRAF); scrollRAF = null; }
        item.classList.remove('dragging');
        item.style.transform = '';

        const delta = currentIndex - startIndex;
        if(delta !== 0){
          const dir = delta > 0 ? 1 : -1;
          for(let k = startIndex; k !== currentIndex; k += dir){
            const idxA = entries[k].i, idxB = entries[k+dir].i;
            [savedPlans[idxA], savedPlans[idxB]] = [savedPlans[idxB], savedPlans[idxA]];
          }
          persistSaved();
        }
        renderSaved();
      }

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}

/* ---------- mantener presionado: menú de lista/favorito ---------- */
function bindSavedLongPress(){
  savedList.querySelectorAll('.saved-item').forEach(item=>{
    let timer = null, startX = 0, startY = 0, moved = false;
    item.addEventListener('pointerdown', e=>{
      if(e.target.closest('.drag-handle') || e.target.closest('.saved-actions')) return;
      moved = false;
      startX = e.clientX; startY = e.clientY;
      timer = setTimeout(()=>{
        if(moved) return;
        item.classList.remove('pressed');
        if(navigator.vibrate) navigator.vibrate(12);
        openSavedItemMenu(+item.dataset.i);
      }, 480);
      item.classList.add('pressed');
    });
    item.addEventListener('pointermove', e=>{
      if(Math.abs(e.clientX-startX) > 8 || Math.abs(e.clientY-startY) > 8){
        moved = true;
        clearTimeout(timer);
        item.classList.remove('pressed');
      }
    });
    ['pointerup','pointerleave','pointercancel'].forEach(evt=>{
      item.addEventListener(evt, ()=>{ clearTimeout(timer); item.classList.remove('pressed'); });
    });
  });
}

function openSavedItemMenu(idx){
  const p = savedPlans[idx];
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <p class="modal-msg" style="font-weight:500; color:var(--text); margin-bottom:12px;">${escapeHtml(p.name)}</p>
      <button type="button" class="menu-item" data-menu="fav">
        <svg viewBox="0 0 24 24" fill="${p.favorite?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9-6.2-3.3-6.2 3.3 1.2-6.9-5-4.9 6.9-1z"/></svg>
        ${p.favorite ? t('unmarkFavoriteAria') : t('markFavoriteAria')}
      </button>
      <button type="button" class="menu-item" data-menu="list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41L11 3.83A2 2 0 009.59 3.24L4 3a1 1 0 00-1 1l.24 5.59a2 2 0 00.59 1.41l9.58 9.58a2 2 0 002.82 0l4.36-4.36a2 2 0 000-2.82z"/><circle cx="7.5" cy="7.5" r="1" fill="currentColor" stroke="none"/></svg>
        ${t('assignListAria')}
      </button>
      <button type="button" class="menu-item menu-item-danger" data-menu="del">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
        ${t('deleteSavedAria')}
      </button>
    </div>`;
  document.body.appendChild(overlay);
  function cleanup(){ overlay.remove(); }
  overlay.addEventListener("click", e=>{ if(e.target===overlay) cleanup(); });
  overlay.querySelector('[data-menu="fav"]').addEventListener("click", ()=>{
    savedPlans[idx].favorite = !savedPlans[idx].favorite;
    persistSaved(); cleanup(); renderSaved();
  });
  overlay.querySelector('[data-menu="list"]').addEventListener("click", async ()=>{
    cleanup();
    const result = await showListPickerModal(savedPlans[idx].listId);
    if(result){
      savedPlans[idx].listId = result.assign || null;
      persistSaved();
    }
    renderSaved();
  });
  overlay.querySelector('[data-menu="del"]').addEventListener("click", async ()=>{
    cleanup();
    const ok = await showConfirm(t('confirmDeleteSaved'));
    if(!ok) return;
    savedPlans.splice(idx,1); persistSaved(); renderSaved();
  });
}

const TOUR_STEPS = {
  clase: [
    { sel: "#searchBox", key: "tour_clase_search" },
    { sel: "#addBlockBtn", key: "tour_clase_addblock" },
    { sel: '#planList [data-act="up"]', key: "tour_clase_cardmove", before: ensureClaseItemForTour },
    { sel: '#planList [data-act="layer-input"]', key: "tour_clase_layers", before: ensureClaseItemForTour },
    { sel: '#planList [data-act="block-select"]', key: "tour_clase_blockselect", before: ensureClaseItemForTour },
    { sel: '#planList [data-act="straps-select"]', key: "tour_clase_straps", before: ensureClaseItemForTour },
    { sel: '#planList [data-field="reps"]', key: "tour_clase_reps", before: ensureClaseItemForTour },
    { sel: '#planList [data-act="add-prop"]', key: "tour_clase_props", before: ensureClaseItemForTour },
    { sel: '#planList [data-act="spring+"]', key: "tour_clase_springs", before: ensureClaseItemForTour },
    { sel: "#planList .notes-input", key: "tour_clase_notes", before: ensureClaseItemForTour },
    { sel: "#saveBtn", key: "tour_clase_save" },
    { sel: "#clearClassBtn", key: "tour_clase_clear" }
  ],
  biblioteca: [
    { sel: "#libSearch", key: "tour_bib_search", before: ensureLibApparatusForTour },
    { sel: "#apparatusRow .apparatus-toggle button", key: "tour_bib_apparatus", before: ensureLibApparatusForTour },
    { sel: "#originRow .filter-chip", key: "tour_bib_origin", before: ensureLibMatOriginForTour },
    { sel: "#filterRow .filter-chip", key: "tour_bib_groups", before: ensureLibApparatusForTour },
    { sel: '#libList [data-act="add-to-plan"]', key: "tour_bib_add", before: ensureLibApparatusForTour },
    { sel: "#newExName", key: "tour_bib_customname", before: ensureLibCustomForTour },
    { sel: "#newExApparatus", key: "tour_bib_customapparatus", before: ensureLibCustomForTour },
    { sel: "#newExGroups", key: "tour_bib_customgroups", before: ensureLibCustomForTour },
    { sel: "#newExPropsRow .check-chip", key: "tour_bib_customprops", before: ensureLibCustomForTour },
    { sel: "#addLibBtn", key: "tour_bib_customadd", before: ensureLibCustomForTour },
    { sel: '#libList [data-act="delete-custom"]', key: "tour_bib_delete", before: ensureLibCustomForTour }
  ],
  resortes: [
    { sel: "#springGradientStrip", key: "tour_res_strip" },
    { sel: ".spring-row summary", key: "tour_res_row" },
    { sel: ".spring-row .spring-hex-input", key: "tour_res_hex", before: ensureSpringRowOpenForTour },
    { sel: ".palette-details summary", key: "tour_res_palette", before: ensureSpringRowOpenForTour },
    { sel: "#resetSpringColorsBtn", key: "tour_res_reset" }
  ],
  guardadas: [
    { sel: "#savedSearch", key: "tour_gua_search" },
    { sel: "#importClassBtn", key: "tour_gua_import" },
    { sel: "#favToggleChip", key: "tour_gua_fav" },
    { sel: "#addListChip", key: "tour_gua_lists" },
    { sel: '#savedList .drag-handle', key: "tour_gua_move" },
    { sel: '#savedList .saved-item .info', key: "tour_gua_list" },
    { sel: '#savedList [data-act="share"]', key: "tour_gua_share" },
    { sel: '#savedList [data-act="view"]', key: "tour_gua_actions" }
  ]
};

let tourState = null;

function currentActiveView(){
  const activeTab = document.querySelector(".tab.active");
  return activeTab ? activeTab.dataset.view : null;
}

function startTour(){
  const view = currentActiveView();
  const steps = TOUR_STEPS[view];
  if(!steps || !steps.length) return;
  tourState = { steps, index: 0 };
  showTourStep();
}

function closeTour(){
  tourState = null;
  if(tourDemoItemAdded){
    plan.items = plan.items.filter(it=>!it.__tourDemo);
    tourDemoItemAdded = false;
    renderPlan();
  }
  ["tourHighlight","tourCallout","tourCloseBtn","tourBlocker"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.remove();
  });
}

function showTourStep(){
  if(!tourState) return;
  const step = tourState.steps[tourState.index];
  if(step.before) step.before();
  const el = document.querySelector(step.sel);
  if(!el){
    if(tourState.index < tourState.steps.length-1){
      tourState.index++;
      showTourStep();
    } else {
      closeTour();
    }
    return;
  }
  el.scrollIntoView({ block:"center", behavior:"instant" });
  setTimeout(()=>positionTourStep(el), 60);
}

function positionTourStep(el){
  if(!tourState) return;
  const step = tourState.steps[tourState.index];
  const r = el.getBoundingClientRect();
  const pad = 6;

  let blocker = document.getElementById("tourBlocker");
  if(!blocker){
    blocker = document.createElement("div");
    blocker.id = "tourBlocker";
    blocker.className = "tour-blocker";
    blocker.addEventListener("click", closeTour);
    document.body.appendChild(blocker);
  }

  let hl = document.getElementById("tourHighlight");
  if(!hl){ hl = document.createElement("div"); hl.id = "tourHighlight"; hl.className = "tour-highlight"; document.body.appendChild(hl); }
  hl.style.top = (r.top-pad)+"px";
  hl.style.left = (r.left-pad)+"px";
  hl.style.width = (r.width+pad*2)+"px";
  hl.style.height = (r.height+pad*2)+"px";

  let cl = document.getElementById("tourCloseBtn");
  if(!cl){
    cl = document.createElement("button");
    cl.id = "tourCloseBtn";
    cl.className = "tour-close";
    cl.addEventListener("click", closeTour);
    document.body.appendChild(cl);
  }
  cl.setAttribute("aria-label", t("tourCloseAria"));
  cl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>';

  let co = document.getElementById("tourCallout");
  if(!co){ co = document.createElement("div"); co.id = "tourCallout"; co.className = "tour-callout"; document.body.appendChild(co); }
  const isLast = tourState.index === tourState.steps.length-1;
  co.innerHTML = `
    <p>${t(step.key)}</p>
    <div class="tour-nav">
      <span class="tour-step-label">${t("tourStepOf", tourState.index+1, tourState.steps.length)}</span>
      <div class="tour-btns">
        <button type="button" class="tour-btn" id="tourPrevBtn" ${tourState.index===0?"disabled":""}>${t("tourPrev")}</button>
        <button type="button" class="tour-btn primary" id="tourNextBtn">${isLast?t("tourDone"):t("tourNext")}</button>
      </div>
    </div>`;

  const vw = window.innerWidth, vh = window.innerHeight;
  const coRect = co.getBoundingClientRect();
  let top = r.bottom + pad + 10;
  if(top + coRect.height > vh - 12) top = r.top - pad - 10 - coRect.height;
  if(top < 12) top = 12;
  let left = r.left;
  if(left + coRect.width > vw - 12) left = vw - coRect.width - 12;
  if(left < 12) left = 12;
  co.style.top = top+"px";
  co.style.left = left+"px";

  document.getElementById("tourPrevBtn").addEventListener("click", ()=>{
    if(tourState.index>0){ tourState.index--; showTourStep(); }
  });
  document.getElementById("tourNextBtn").addEventListener("click", ()=>{
    if(tourState.index < tourState.steps.length-1){ tourState.index++; showTourStep(); }
    else closeTour();
  });
}

document.getElementById("helpTourBtn").addEventListener("click", startTour);

/* ---------- utils ---------- */
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
